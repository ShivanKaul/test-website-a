<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBSC cross-site test</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { max-width: 800px; }
    iframe { width: 100%; height: 170px; border: 1px solid var(--line); border-radius: 8px; }
  </style>
</head>
<body>
  <h1>DBSC cross-site test</h1>
  <p>Use a fresh profile for each sequence. Compare DBSC IDs; the ordinary
  cookie should disappear.</p>
  <ol>
    <li><a href="?mode=seed">Seed B in A</a> →
      <a href="https://test-website-b.pages.dev/dbsc-partitioning/observe">Check B</a></li>
    <li><a href="https://test-website-b.pages.dev/dbsc-partitioning/seed">Seed B</a> →
      <a href="?mode=observe">Check B in A</a></li>
  </ol>
  <section id="test" hidden>
    <p id="phase"></p>
    <iframe id="tracker" title="Website B test frame"></iframe>
    <pre id="result" data-state="checking">Checking…</pre>
  </section>
  <script>
    const B_ORIGIN = "https://test-website-b.pages.dev";
    const selectedMode = new URLSearchParams(location.search).get("mode");
    const mode = ["seed", "observe"].includes(selectedMode) ? selectedMode : null;
    const frame = document.getElementById("tracker");
    const result = document.getElementById("result");
    if (mode) {
      document.getElementById("test").hidden = false;
      document.getElementById("phase").textContent = mode === "seed"
        ? "B iframe: seed" : "B iframe: check";
      frame.src = `${B_ORIGIN}/dbsc-partitioning/${mode}`;
    }
    window.addEventListener("message", event => {
      if (event.origin !== B_ORIGIN || event.source !== frame.contentWindow) return;
      const data = event.data;
      if (!data || data.type !== "dbsc-probe" || data.mode !== mode) return;
      result.dataset.state = data.done ? "done" : "checking";
      result.dataset.dbsc = data.dbsc || "";
      result.dataset.ordinary = data.ordinary || "";
      result.textContent = data.error
        ? data.error
        : `DBSC: ${data.dbsc || "absent"}\nCookie: ${data.ordinary || "absent"}`;
    });
  </script>
</body>
</html>
