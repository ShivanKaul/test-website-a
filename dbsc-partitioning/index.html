<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBSC cookie test</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    iframe {
      display: block;
      width: 100%;
      box-sizing: border-box;
      height: 155px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>DBSC cookie test</h1>
  <p>Site B is embedded below. When it finishes, open B directly and compare.</p>

  <iframe id="site-b" title="Site B embedded in Site A"
    src="https://test-website-b.pages.dev/dbsc-partitioning/seed"></iframe>

  <p class="actions">
    <a href="https://test-website-b.pages.dev/dbsc-partitioning/observe"
      target="_blank" rel="noopener">Open Site B directly</a>
    <button id="reset" type="button">Reset</button>
  </p>
  <p id="status" class="status" role="status"></p>

  <script>
    const B_ORIGIN = "https://test-website-b.pages.dev";
    const frame = document.getElementById("site-b");
    const reset = document.getElementById("reset");
    const status = document.getElementById("status");

    reset.addEventListener("click", () => {
      reset.disabled = true;
      status.textContent = "Resetting…";
      frame.src = `${B_ORIGIN}/dbsc-partitioning/reset`;
    });

    window.addEventListener("message", event => {
      if (event.origin !== B_ORIGIN || event.source !== frame.contentWindow ||
          event.data?.type !== "dbsc-reset-complete") return;
      location.replace(`${B_ORIGIN}/dbsc-partitioning/reset`);
    });
  </script>
</body>
</html>
