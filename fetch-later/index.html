<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fetchLater Blocking</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    td.res { white-space: nowrap; }
  </style>
</head>
<body>
  <h1>fetchLater Blocking</h1>

  <div class="card">
    <p>Tracker: <code>https://test-website-b.pages.dev/fetch-later/beacon/stats</code>, blocked by the EasyPrivacy rule <code>/beacon/stats</code>.</p>
    <table>
      <thead><tr><th>Test</th><th>Result</th></tr></thead>
      <tbody>
        <tr><td><code>fetch()</code> to a tracker is blocked</td><td class="res muted" id="fetch">Running...</td></tr>
        <tr><td><code>fetchLater()</code> to a tracker is blocked</td><td class="res muted" id="now">Running...</td></tr>
        <tr><td><code>fetchLater()</code> to a tracker on page unload is blocked</td><td class="res muted" id="unload">Running...</td></tr>
      </tbody>
    </table>
    <p><button onclick="location.reload()">Reload</button></p>
  </div>

  <script>
    // /beacon/stats is on EasyPrivacy.
    const BASE = 'https://test-website-b.pages.dev/fetch-later/beacon/';
    const OPTS = { mode: 'no-cors', credentials: 'include', cache: 'no-store' };
    const PENDING = 'fetch-later-pending';
    const id = Date.now().toString(36);
    const prev = sessionStorage.getItem(PENDING);

    function url(path, key) {
      return BASE + path + '?k=' + key;
    }

    function set(cell, text, cls) {
      const td = document.getElementById(cell);
      td.textContent = text;
      td.className = 'res ' + cls;
    }

    function arrived(key) {
      return document.cookie.split('; ').includes('fl_' + key + '=1');
    }

    async function verdict(cell, tracker, ok) {
      const start = Date.now();
      let okAt = 0;
      while (Date.now() - start < 5000) {
        if (arrived(tracker)) return set(cell, 'FAIL', 'bad');
        if (!okAt && arrived(ok)) okAt = Date.now();
        if (okAt && Date.now() - okAt >= 1000) return set(cell, 'PASS', 'ok');
        await new Promise(function (r) { setTimeout(r, 100); });
      }
      set(cell, 'Inconclusive', 'warn');
    }

    async function run() {
      fetch(url('stats', id + '_fetch'), OPTS)
        .then(function () { set('fetch', 'FAIL', 'bad'); },
              function () { set('fetch', 'PASS', 'ok'); });

      if (typeof window.fetchLater !== 'function') {
        set('now', 'Not supported', 'warn');
        set('unload', 'Not supported', 'warn');
        return;
      }

      for (const p of ['stats', 'ok']) {
        fetchLater(url(p, id + '_now_' + p), Object.assign({ activateAfter: 0 }, OPTS));
        fetchLater(url(p, id + '_unload_' + p), OPTS);
      }
      sessionStorage.setItem(PENDING, id);

      verdict('now', id + '_now_stats', id + '_now_ok');
      if (prev) verdict('unload', prev + '_unload_stats', prev + '_unload_ok');
      else set('unload', 'Reload to run', 'muted');
    }

    run();
  </script>
</body>
</html>
