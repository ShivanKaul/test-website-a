<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fetchLater Blocking</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    td.res { white-space: nowrap; }
  </style>
</head>
<body>
  <h1>fetchLater Blocking</h1>

  <div class="card">
    <table>
      <thead><tr><th>Test</th><th>Result</th></tr></thead>
      <tbody>
        <tr><td><code>fetchLater()</code> to a tracker is blocked</td><td class="res muted" id="now">...</td></tr>
        <tr><td><code>fetchLater()</code> to a tracker on page unload is blocked</td><td class="res muted" id="unload">...</td></tr>
      </tbody>
    </table>
    <p><button onclick="location.reload()">Reload</button></p>
  </div>

  <script>
    // /beacon/stats matches EasyPrivacy; /beacon/ok does not. Site B redirects
    // both to site A's /fetch-later/hit, which sets a cookie when reached.
    const BASE = 'https://test-website-b.pages.dev/fetch-later/beacon/';
    const OPTS = { mode: 'no-cors', credentials: 'include', cache: 'no-store' };
    const PENDING = 'fetch-later-pending';
    const id = Date.now().toString(36);
    const prev = sessionStorage.getItem(PENDING);

    function url(path, key) {
      return BASE + path + '?k=' + key;
    }

    function set(cell, text, cls) {
      const td = document.getElementById(cell);
      td.textContent = text;
      td.className = 'res ' + cls;
    }

    async function arrived(key) {
      for (let i = 0; i < 25; i++) {
        if (document.cookie.split('; ').includes('fl_' + key + '=1')) return true;
        await new Promise(function (r) { setTimeout(r, 200); });
      }
      return false;
    }

    // tracker/ok are the cookie keys for the blocked URL and the unblocked one.
    async function verdict(cell, tracker, ok) {
      const [t, o] = await Promise.all([arrived(tracker), arrived(ok)]);
      if (t) set(cell, 'FAIL', 'bad');
      else if (o) set(cell, 'PASS', 'ok');
      else set(cell, 'Inconclusive', 'warn');
    }

    async function run() {
      if (typeof window.fetchLater !== 'function') {
        set('now', 'Not supported', 'warn');
        set('unload', 'Not supported', 'warn');
        return;
      }

      const shieldsOn = await fetch(url('stats', id + '_fetch'), OPTS)
        .then(function () { return false; }, function () { return true; });

      for (const p of ['stats', 'ok']) {
        fetchLater(url(p, id + '_now_' + p), Object.assign({ activateAfter: 0 }, OPTS));
        fetchLater(url(p, id + '_unload_' + p), OPTS);
      }
      sessionStorage.setItem(PENDING, id);

      if (!shieldsOn) {
        set('now', 'Shields off', 'warn');
        set('unload', 'Shields off', 'warn');
        return;
      }
      verdict('now', id + '_now_stats', id + '_now_ok');
      if (prev) verdict('unload', prev + '_unload_stats', prev + '_unload_ok');
      else set('unload', 'Reload to run', 'muted');
    }

    run();
  </script>
</body>
</html>
